name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: careervine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: careervine/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: UI events guard
        run: node scripts/check-ui-events.mjs

      # Twelve checks. CAR-158: barrel freeze, rule-17 CAS shape, unchecked
      # reads, MCP raw-query-builder growth, MCP launch flags. CAR-187: typed
      # test mocks. CAR-190: the client-state rules — no raw fetch(, no native
      # confirm(), plus ratchets on double-submit guards, useLatestRequest and
      # dialog roles. Sits next to the ui-events guard and before Test so a
      # convention break is not mistaken for a test failure.
      - name: Conventions guard
        run: node scripts/check-conventions.mjs

      # CAR-186: --coverage is what enforces the src/lib + src/hooks floors and
      # uncovered-code budgets declared in careervine/vitest.config.ts. Without
      # the flag the thresholds are inert and a new untested module lands green.
      - name: Test
        run: npx vitest run --coverage

      # CAR-195: BYOK_ENCRYPTION_KEY has to be a real 32-byte base64 key, not the
      # word "placeholder", so it cannot be a flat literal like its neighbours
      # below — and a committed base64 blob is exactly what secret scanners flag.
      # GitGuardian failed every PR on the old hardcoded value. Minting it here
      # keeps the build valid and leaves nothing secret-shaped in the repo.
      - name: Mint throwaway BYOK key for the build
        run: echo "BYOK_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build
        run: npx next build
        env:
          # Placeholder, non-secret values so the production build is
          # deterministic without real credentials. Next collects page data by
          # evaluating route modules, some of which validate env at module scope
          # (e.g. getSupabaseEnv), so every var read at build time needs a dummy.
          # The build never connects anywhere; real values live in Vercel.
          # Validated locally by building with .env.local hidden and only these set.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://www.careervine.app
          NEXT_PUBLIC_EXTENSION_STORE_URL: https://chromewebstore.google.com/detail/placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          NEXT_PUBLIC_POSTHOG_KEY: phc_placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          OPENAI_API_KEY: sk-placeholder
          OPENAI_MODEL: gpt-4o-mini
          GOOGLE_CLIENT_ID: placeholder.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: placeholder
          GOOGLE_REDIRECT_URI: https://www.careervine.app/api/gmail/callback
          DEEPGRAM_API_KEY: placeholder
          SERPER_API_KEY: placeholder
          QSTASH_TOKEN: placeholder
          QSTASH_CURRENT_SIGNING_KEY: sig_placeholder
          QSTASH_NEXT_SIGNING_KEY: sig_placeholder
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder
          BUNDLE_ADMIN_TOKEN: placeholder
          R2_ACCOUNT_ID: placeholder
          R2_ACCESS_KEY_ID: placeholder
          R2_SECRET_ACCESS_KEY: placeholder
          R2_BUCKET: placeholder-bucket
          R2_PUBLIC_BASE_URL: https://placeholder.r2.dev
          RESEND_API_KEY: re_placeholder
          APIFY_API_TOKEN: placeholder
          APIFY_WEBHOOK_SECRET: placeholder
          NUDGE_UNSUBSCRIBE_SECRET: placeholder
          APP_BASE_URL: https://www.careervine.app

  mcp:
    name: mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            careervine/package-lock.json
            careervine-mcp/package-lock.json

      # The MCP tsconfig resolves @modelcontextprotocol/sdk and @/* imports out
      # of ../careervine (node_modules + src), so its typecheck needs careervine's
      # dependencies installed as well as its own.
      - name: Install careervine deps
        working-directory: careervine
        run: npm ci

      - name: Install mcp deps
        working-directory: careervine-mcp
        run: npm ci

      - name: Typecheck
        working-directory: careervine-mcp
        run: npm run typecheck

  types-drift:
    name: types-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: careervine/package-lock.json

      # gen:types calls scripts/gen-supabase-types.sh, which runs `supabase gen
      # types --local` against a local Postgres built from the full migration
      # chain. Pin the CLI so the output is byte-identical to what generated the
      # committed file; a version bump here must be paired with a regen commit.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local Postgres at the full migration chain
        run: supabase start -x studio,mailpit,imgproxy,edge-runtime,realtime,storage-api,vector,logflare,supavisor

      - name: Regenerate types from migrations
        working-directory: careervine
        run: npm run gen:types

      # A migration PR that forgets to regenerate types (or any hand-edit to the
      # generated file) turns this red.
      - name: Fail if committed database.types.ts is stale
        run: git diff --exit-code -- careervine/src/lib/database.types.ts

  # CAR-178: the integration tier. Real Postgres + PostgREST + GoTrue + RLS
  # at the full migration chain — the semantics the unit suite's builder
  # mocks structurally cannot check (RLS policy legs, CAS claim behavior,
  # CHECK-constraint conformance, deletion cascade). Separate job so the
  # fast suite stays fast; see careervine/vitest.integration.config.ts.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: careervine/package-lock.json

      # Same pinned CLI as types-drift; the tier resolves keys via
      # `supabase status -o env` and refuses non-local stacks.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local Supabase at the full migration chain
        run: supabase start -x studio,mailpit,imgproxy,edge-runtime,realtime,storage-api,vector,logflare,supavisor

      - name: Install
        working-directory: careervine
        run: npm ci

      - name: Integration tests
        working-directory: careervine
        run: npm run test:integration

  # CAR-189: the E2E tier. Real Chromium against a real production build of the
  # app, backed by the same local Supabase stack the integration job uses — the
  # only tier that can tell an optimistic client update apart from a persisted
  # one (which is where CAR-183's class of bug lives).
  #
  # Third parties are intercepted INSIDE the Next server process by
  # careervine/e2e/server-stubs/register.mjs, because the calls that matter
  # (Gmail) are made server-side and page.route() cannot see them. Every
  # non-loopback origin is denied there, so this job cannot reach production
  # Supabase or spend money on an API.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: careervine/package-lock.json

      # Same pinned CLI as types-drift and integration.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # NOTE the exclusion list differs from the integration job by one entry:
      # mailpit is NOT excluded. `enable_confirmations` is on (matching
      # production), so the signup flow reads the real confirmation email out of
      # Mailpit's API. Excluding it makes signup fail with "Error sending
      # confirmation email".
      - name: Start local Supabase at the full migration chain
        run: supabase start -x studio,imgproxy,edge-runtime,realtime,storage-api,vector,logflare,supavisor

      - name: Install
        working-directory: careervine
        run: npm ci

      - name: Install Chromium
        working-directory: careervine
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's webServer block runs `next build && next start`
      # itself, with the local stack's env.
      - name: E2E tests
        working-directory: careervine
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: careervine/playwright-report/
          retention-days: 7

      # Traces, screenshots and video for the failing test only — this is the
      # artifact that makes a CI failure watchable instead of reproducible.
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: careervine/test-results/
          retention-days: 7

  extension:
    name: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chrome-extension/panel-app/package-lock.json

      - name: Install
        working-directory: chrome-extension/panel-app
        run: npm ci

      # F14: the panel-app's strict tsconfig now actually runs. A PR that
      # introduces a type error in panel-app/src goes red here.
      - name: Typecheck (panel-app)
        working-directory: chrome-extension/panel-app
        run: npm run typecheck

      - name: Build panel bundle
        working-directory: chrome-extension/panel-app
        run: npm run build

      # F33: the committed 212KB runtime bundle can silently drift from source.
      # Rebuilding and comparing the whole output directory (not just panel.js)
      # catches a stale bundle (src edited without a rebuild), a hand-edited
      # bundle, and any added or removed output file — e.g. a future multi-file
      # split a single-file diff would miss. The build is deterministic across
      # Node versions and platforms for the lockfile-pinned toolchain.
      - name: Verify committed panel bundle is fresh
        run: |
          CHANGES="$(git status --porcelain -- chrome-extension/src/content/panel-app)"
          if [ -n "$CHANGES" ]; then
            echo "::error::Committed panel bundle is stale. Run 'cd chrome-extension/panel-app && npm ci && npm run build' and commit chrome-extension/src/content/panel-app/."
            echo "$CHANGES"
            git diff -- chrome-extension/src/content/panel-app
            exit 1
          fi
